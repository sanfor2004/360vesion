<div id="stage"><div class="grid"></div><div class="orbit"></div><img class="photo" hidden><div class="shade" hidden></div><div class="brand"><img src="../../public/brand/360studio-symbol.svg"><div><span>360</span>Vision</div></div><div class="edition">SPACES, CONNECTED.</div><div class="copy"><div class="eyebrow"></div><h1></h1><p></p><div class="tag"><i></i><span>Local studio. Your creative space.</span></div></div><div class="window"><div class="chrome"><i></i><i></i><i></i><span>360VISION / INTERACTIVE PROPERTY TOUR</span></div><img id="screen"></div><div class="phone"><img src="../../public/markting/screenshots/viewer-mobile-immersive.png"></div><div class="float"></div><div class="footer"><span>sanfor2004.github.io</span><span class="count"></span></div><div class="progress"></div></div>
<script>
const assets='../../public/markting/';
const definitions={
hero:['A NEW WAY TO SHOW SPACE','Every space.<br>A new <em>perspective.</em>','Create interactive 360° property tours.<br>Bring rooms, details, and floor plans together.','viewer-desktop','360°','Step inside the story.'],
explore:['01 / IMMERSIVE VIEWING','Let the room<br><em>tell its story.</em>','Look around. Follow a hotspot.<br>Discover what makes each space unique.','viewer-desktop','360°','Explore every angle.'],
map:['02 / CONNECTED SPACES','Every room.<br><em>One clear path.</em>','Move through a property with room navigation<br>and an optional interactive floor plan.','floor-plan-navigation','↗','Find your way, naturally.'],
studio:['03 / THE CREATIVE STUDIO','Your vision.<br><em>In the details.</em>','Arrange scenes, place hotspots, and set<br>the opening view. Saved locally as you work.','studio-desktop','✓','Edit. Preview. Refine.'],
mobile:['04 / RESPONSIVE VIEWER','A whole space.<br><em>A smaller screen.</em>','A compact room strip. Touch exploration.<br>Your tour, in a mobile browser.','viewer-mobile-immersive','↔','Made to look around.'],
lifestyle:['MADE FOR PROPERTY STORYTELLERS','Spaces worth<br><em>spending time in.</em>','Turn a collection of panoramas<br>into a connected viewing experience.','lifestyle-original','', ''],
product:['INTRODUCING 360VISION','A new dimension<br><em>to your work.</em>','A local studio for interactive<br>real-estate tours.','studio-original','',''],
closing:['360VISION / LOCAL TOUR STUDIO','Make every<br><em>space a story.</em>','Explore the project and how it was built.<br>sanfor2004.github.io','studio-original','','']
};
let current='';
function setCard(key,format='wide',video=false){
 const d=definitions[key], photo=['lifestyle','product','closing'].includes(key);
 document.getElementById('stage').className=[format,photo?'photo-mode':'',key==='mobile'?'mobile':'',key==='studio'?'studio-card':'',video?'video':''].join(' ');
 document.querySelector('.eyebrow').textContent=d[0];document.querySelector('h1').innerHTML=d[1];document.querySelector('p').innerHTML=d[2];
 document.querySelector('.float').innerHTML='<b>'+d[4]+'</b>'+d[5];document.querySelector('.count').textContent=photo?'360VISION / CAMPAIGN':'PANORAMAS → EXPERIENCES';
 document.querySelector('.photo').hidden=!photo;document.querySelector('.shade').hidden=!photo;
 if(photo)document.querySelector('.photo').src=assets+'images/'+d[3]+'.png';else document.getElementById('screen').src=assets+'screenshots/'+d[3]+'.png';
 current=key;
}
window.setCard=setCard;
window.renderFrame=async function(t,format='wide'){
 const keys=['hero','explore','map','studio','lifestyle','closing'];const n=Math.min(5,Math.floor(t/5));const local=t-n*5;const key=keys[n];
 if(current!==key||!document.getElementById('stage').classList.contains('video'))setCard(key,format,true);
 const ease=1-Math.pow(1-Math.min(1,local/1.1),3);const alpha=Math.min(1,local/.35,(5-local)/.35);
 for(const sel of ['.copy','.window','.photo','.float'])document.querySelector(sel).style.opacity=Math.max(0,alpha);
 document.querySelector('.copy').style.transform=`translateY(${(1-ease)*26}px)`;
 document.querySelector('.window').style.transform=`translateY(${(1-ease)*36}px) scale(${.975+ease*.025})`;
 document.querySelector('.photo').style.transform=`scale(${1.025+local*.004})`;
 document.querySelector('.float').style.transform=`translateY(${Math.sin(local*1.7)*5}px)`;
 document.querySelector('.orbit').style.transform=`translate(${Math.sin(t*.2)*20}px,${Math.cos(t*.2)*12}px)`;
 document.querySelector('.progress').style.width=t/30*100+'%';
 if(n===1||n===2){const frame=Math.min(239,Math.floor((n-1)*120+local*24));document.getElementById('screen').src='../../temp/marketing/tour-frames/'+String(frame).padStart(4,'0')+'.jpg';}
 await Promise.all([...document.images].filter(i=>!i.hidden&&i.src).map(i=>i.decode().catch(()=>{})));
};
setCard('hero');
</script></html>
